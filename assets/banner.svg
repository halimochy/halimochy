<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nurhalimah, Software Engineer, Full-stack and Data" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .name { font: 700 56px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill:#F8FAFC; letter-spacing:-1px; }
      .role { font: 500 24px 'Inter','Segoe UI',Helvetica,Arial,sans-serif; fill:#CBD5E1; }
      .mono { font: 500 16px 'JetBrains Mono','Fira Code',Consolas,monospace; fill:#38BDF8; }
      .tag  { font: 500 15px 'JetBrains Mono','Fira Code',Consolas,monospace; fill:#E2E8F0; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="16" fill="url(#grid)"/>
  <rect x="72" y="78" width="6" height="144" rx="3" fill="#38BDF8"/>
  <text x="100" y="104" class="mono">~/halimochy $ whoami</text>
  <text x="100" y="166" class="name">Nurhalimah</text>
  <text x="100" y="208" class="role">Software Engineer · Full-stack &amp; Data Engineering</text>
  <rect x="100" y="228" width="12" height="3" fill="#38BDF8" class="cursor"/>
  <g transform="translate(860,96)">
    <rect width="268" height="120" rx="12" fill="#FFFFFF" fill-opacity="0.06" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="22" y="36" class="tag">React · JavaScript</text>
    <text x="22" y="64" class="tag">Python · SQL · ETL</text>
    <text x="22" y="92" class="tag">Power BI · Digitalization</text>
  </g>
</svg>
